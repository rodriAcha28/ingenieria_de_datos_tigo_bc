services:
  
  postgres-warehouse:
    image: postgres:15
    environment:
      POSTGRES_USER: rodrick
      POSTGRES_PASSWORD: rodrick123
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rodrick -d warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  postgres-airflow:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
      POSTGRES_DB: airflow
    volumes:
      - airflow_meta_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  
  airflow-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    depends_on:
      postgres-airflow:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true

  airflow-webserver:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      WAREHOUSE_HOST: postgres-warehouse
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: rodrick
      WAREHOUSE_PASSWORD: rodrick123
      BRONZE_DATA_PATH: /opt/airflow/data/bronze   
      SILVER_DATA_PATH: /opt/airflow/data/silver    
    volumes:
      - ../dags:/opt/airflow/dags
      - ../sql:/opt/airflow/sql
      - ../src:/opt/airflow/src
      - ../data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres-airflow/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      WAREHOUSE_HOST: postgres-warehouse
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: rodrick
      WAREHOUSE_PASSWORD: rodrick123
      BRONZE_DATA_PATH: /opt/airflow/data/bronze   
      SILVER_DATA_PATH: /opt/airflow/data/silver   
    volumes:
      - ../dags:/opt/airflow/dags
      - ../sql:/opt/airflow/sql
      - ../src:/opt/airflow/src
      - ../data:/opt/airflow/data
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  jupyter:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jupyter
    environment:
      JUPYTER_TOKEN: rodrick
      WAREHOUSE_HOST: postgres-warehouse
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: rodrick
      WAREHOUSE_PASSWORD: rodrick123
      BRONZE_DATA_PATH: /home/jovyan/work/data/bronze
      SILVER_DATA_PATH: /home/jovyan/work/data/silver
    volumes:
      - ../notebooks:/home/jovyan/work/notebooks
      - ../data:/home/jovyan/work/data
      - ../src:/home/jovyan/work/src
    ports:
      - "8888:8888"
    depends_on:
      postgres-warehouse:
        condition: service_healthy

volumes:
  warehouse_data:
  airflow_meta_data: